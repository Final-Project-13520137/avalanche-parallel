apiVersion: v1
kind: Service
metadata:
  name: avalanche-api-gateway
  namespace: avalanche-parallel
spec:
  selector:
    app: avalanche-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avalanche-api-gateway
  namespace: avalanche-parallel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avalanche-api-gateway
  template:
    metadata:
      labels:
        app: avalanche-api-gateway
        component: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: nginx:1.24-alpine
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-gateway-config
          mountPath: /etc/nginx/conf.d/
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-base-config
      - name: nginx-gateway-config
        configMap:
          name: nginx-gateway-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-base-config
  namespace: avalanche-parallel
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # Gzip Settings
        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/json application/xml+rss application/javascript;

        # Load balancing
        upstream avalanche_main {
            server avalanche-main-node.avalanche-parallel.svc.cluster.local:9650 max_fails=3 fail_timeout=30s;
        }

        upstream avalanche_workers {
            least_conn;
            server avalanche-worker.avalanche-parallel.svc.cluster.local:9652 max_fails=3 fail_timeout=30s;
        }

        include /etc/nginx/conf.d/*.conf;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
  namespace: avalanche-parallel
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main node API endpoints
        location /ext/ {
            proxy_pass http://avalanche_main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Worker API endpoints
        location /worker/ {
            rewrite ^/worker/(.*) /$1 break;
            proxy_pass http://avalanche_workers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://avalanche_main/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default location
        location / {
            return 404;
        }
    } 