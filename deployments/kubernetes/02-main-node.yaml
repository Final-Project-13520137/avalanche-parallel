apiVersion: v1
kind: Service
metadata:
  name: avalanche-main-node
  namespace: avalanche-parallel
spec:
  selector:
    app: avalanche-main-node
  ports:
    - name: api
      port: 9650
      targetPort: 9650
    - name: p2p
      port: 9651
      targetPort: 9651
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avalanche-main-node
  namespace: avalanche-parallel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avalanche-main-node
  template:
    metadata:
      labels:
        app: avalanche-main-node
        component: coordinator
    spec:
      containers:
      - name: main-node
        image: your-registry.io/avalanche-main-node:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9650
          name: api
        - containerPort: 9651
          name: p2p
        - containerPort: 9090
          name: metrics
        env:
        - name: NETWORK
          valueFrom:
            configMapKeyRef:
              name: avalanche-config
              key: network
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: avalanche-config
              key: log_level
        - name: MAX_PROCESSING_THREADS
          valueFrom:
            configMapKeyRef:
              name: avalanche-config
              key: max_processing_threads
        - name: RABBITMQ_HOST
          value: "rabbitmq.avalanche-parallel.svc.cluster.local"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "avalanche"
        - name: RABBITMQ_PASS
          value: "avalanche123"
        - name: DAG_STATE_SYNC_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: avalanche-config
              key: dag_state_sync_interval
        - name: CONSENSUS_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: avalanche-config
              key: consensus_timeout
        - name: NODE_ROLE
          value: "coordinator"
        - name: ENABLE_DAG_STATE_MGMT
          value: "true"
        - name: ENABLE_CONSENSUS_ORCH
          value: "true"
        - name: ENABLE_RESULT_AGGREG
          value: "true"
        volumeMounts:
        - name: avalanche-data
          mountPath: /root/.avalanchego
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /ext/health
            port: 9650
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ext/health
            port: 9650
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: avalanche-data
        persistentVolumeClaim:
          claimName: avalanche-main-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avalanche-main-data
  namespace: avalanche-parallel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi 