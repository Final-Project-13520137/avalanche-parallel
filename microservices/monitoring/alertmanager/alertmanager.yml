global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@avalanche-parallel.local'
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    # Critical alerts
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 30m

    # Worker pool specific alerts
    - match_re:
        alertname: .*Worker.*
      receiver: 'worker-alerts'
      group_by: ['worker_type', 'pool_id']

    # Consensus alerts
    - match_re:
        alertname: .*Consensus.*
      receiver: 'consensus-alerts'
      group_wait: 15s

    # Database alerts
    - match_re:
        alertname: .*Database.*
      receiver: 'database-alerts'

    # System resource alerts
    - match_re:
        alertname: High.*Usage|HighCPULoad|HighDiskUsage
      receiver: 'resource-alerts'
      group_interval: 5m

receivers:
  - name: 'default'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#avalanche-monitoring'
        title: 'Avalanche Alert - {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@avalanche-parallel.local'
        subject: 'CRITICAL: Avalanche Alert - {{ .GroupLabels.alertname }}'
        body: |
          Critical alert fired:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}
    
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#avalanche-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          <!channel>
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          *Time:* {{ .StartsAt }}
          {{ end }}
        send_resolved: true

    webhook_configs:
      - url: 'http://pagerduty-webhook:8080/alerts'
        send_resolved: true

  - name: 'worker-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#avalanche-workers'
        title: '⚠️ Worker Pool Alert - {{ .GroupLabels.worker_type }}'
        text: |
          {{ range .Alerts }}
          *Worker Type:* {{ .Labels.worker_type }}
          *Pool ID:* {{ .Labels.pool_id }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true

  - name: 'consensus-alerts'
    email_configs:
      - to: 'consensus-team@avalanche-parallel.local'
        subject: 'Consensus Alert - {{ .GroupLabels.alertname }}'
        body: |
          Consensus system alert:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Time: {{ .StartsAt }}
          {{ end }}
    
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#avalanche-consensus'
        title: '🔄 Consensus Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}

  - name: 'database-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#avalanche-database'
        title: '💾 Database Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Database:* {{ .Labels.database }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  - name: 'resource-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#avalanche-infrastructure'
        title: '🖥️ Resource Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

inhibit_rules:
  # Inhibit any alert that has 'alertname' as 'InfoInhibitor'
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Don't send worker alerts if the entire worker pool is down
  - source_match:
      alertname: 'WorkerPoolDown'
    target_match_re:
      alertname: 'High.*Worker.*'
    equal: ['instance']

  # Don't send individual service alerts if the entire node is down
  - source_match:
      alertname: 'InstanceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance'] 