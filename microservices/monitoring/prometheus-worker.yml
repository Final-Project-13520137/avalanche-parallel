global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Consensus Workers
  - job_name: 'consensus-workers'
    static_configs:
      - targets: 
          - 'consensus-worker-1:8080'
          - 'consensus-worker-2:8080'
          - 'consensus-worker-3:8080'
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Validator Workers  
  - job_name: 'validator-workers'
    static_configs:
      - targets:
          - 'validator-worker-1:8081'
          - 'validator-worker-2:8081'
          - 'validator-worker-3:8081'
          - 'validator-worker-4:8081'
          - 'validator-worker-5:8081'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s

  # DAG+State Workers
  - job_name: 'dag-state-workers'
    static_configs:
      - targets:
          - 'dag-state-worker-1:8082'
          - 'dag-state-worker-2:8082'
    metrics_path: /metrics
    scrape_interval: 45s
    scrape_timeout: 15s

  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9750']
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis Monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics
    scrape_interval: 30s

  # PostgreSQL Monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: /metrics
    scrape_interval: 60s

  # HAProxy Load Balancers
  - job_name: 'load-balancers'
    static_configs:
      - targets:
          - 'consensus-worker-lb:8404'
          - 'validator-worker-lb:8404'
          - 'dag-state-worker-lb:8404'
    metrics_path: /stats/prometheus
    scrape_interval: 30s 