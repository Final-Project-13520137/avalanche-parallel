global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Consensus Workers (service-level scrape)
  - job_name: 'consensus-workers'
    static_configs:
      - targets: ['consensus-worker:8080']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Validator Workers (service-level scrape) 
  - job_name: 'validator-workers'
    static_configs:
      - targets: ['validator-worker:8081']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s

  # DAG+State Workers (service-level scrape)
  - job_name: 'dag-state-workers'
    static_configs:
      - targets: ['dag-state-worker:8082']
    metrics_path: /metrics
    scrape_interval: 45s
    scrape_timeout: 15s

  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9750']
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis Monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics
    scrape_interval: 30s

  # PostgreSQL Monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: /metrics
    scrape_interval: 60s

  # cAdvisor (container CPU/Memory)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scrape_interval: 15s

  # Worker Monitor aggregator (queue depth, processing time)
  - job_name: 'worker-monitor'
    static_configs:
      - targets: ['worker-monitor:8080']
    metrics_path: /metrics
    scrape_interval: 15s

  # HAProxy Load Balancers
  - job_name: 'load-balancers'
    static_configs:
      - targets:
          - 'consensus-worker-lb:8404'
          - 'validator-worker-lb:8404'
          - 'dag-state-worker-lb:8404'
    metrics_path: /stats/prometheus
    scrape_interval: 30s 