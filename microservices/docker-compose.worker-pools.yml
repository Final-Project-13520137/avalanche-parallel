# Docker Compose configuration for Avalanche Parallel Processing System

services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    container_name: avalanche-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      avalanche-net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: avalanche-postgres
    environment:
      POSTGRES_DB: avalanche
      POSTGRES_USER: avalanche
      POSTGRES_PASSWORD: avalanche123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: trust
    command: 
      - "postgres"
      - "-c"
      - "ssl=off"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      avalanche-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalanche"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # API Gateway with HAProxy Load Balancer
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: avalanche-api-gateway
    ports:
      - "9650:9650"
      - "9750:9750"
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgres://avalanche:avalanche123@postgres:5432/avalanche
      - CONSENSUS_ENDPOINT=http://consensus-haproxy:8080
      - VALIDATOR_ENDPOINT=http://validator-haproxy:8081
      - DAG_STATE_ENDPOINT=http://dag-state-haproxy:8082
    networks:
      avalanche-net:
        aliases:
          - api-gateway
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # Main Coordinator (Queue Balancer + Orchestrator)
  main-coordinator:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: coordinator
    container_name: main-coordinator
    environment:
      REDIS_URL: redis://redis:6379
      SUBMISSION_QUEUE: gateway_submissions
      RESULT_PREFIX: "submission_results:"
    networks:
      avalanche-net:
        aliases:
          - coordinator
    depends_on:
      - redis
    restart: unless-stopped

  # Consensus Workers Pool (built from multi-stage Dockerfile)
  consensus-worker:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: consensus-worker
    image: avalanche-consensus-worker
    deploy:
      replicas: 4  # Scale between 2-10 workers
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - WORKER_TYPE=consensus
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=4
      - LOG_LEVEL=info
      - METRICS_PORT=8080
      - TASK_QUEUE=consensus_tasks_medium
      - RESULT_QUEUE=consensus_results
    networks:
      avalanche-net:
        aliases:
          - consensus-worker
    depends_on:
      - redis
    restart: unless-stopped

  # Validator Workers Pool (built from multi-stage Dockerfile)
  validator-worker:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: validator-worker
    image: avalanche-validator-worker
    deploy:
      replicas: 6  # Scale between 3-15 workers
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - WORKER_TYPE=validator
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=4
      - LOG_LEVEL=info
      - METRICS_PORT=8081
      - TASK_QUEUE=validation_tasks_medium
      - RESULT_QUEUE=validation_results
    networks:
      avalanche-net:
        aliases:
          - validator-worker
    depends_on:
      - redis
    restart: unless-stopped

  # DAG State Workers Pool (built from multi-stage Dockerfile)
  dag-state-worker:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: dag-state-worker
    image: avalanche-dag-state-worker
    deploy:
      replicas: 3  # Scale between 2-8 workers
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - WORKER_TYPE=dag-state
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgres://avalanche:avalanche123@postgres:5432/avalanche?sslmode=disable
      - MAX_WORKERS=4
      - LOG_LEVEL=info
      - METRICS_PORT=8082
      - TASK_QUEUE=dag_tasks_medium
      - RESULT_QUEUE=dag_state_results
    networks:
      avalanche-net:
        aliases:
          - dag-state-worker
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # Load Balancers
  consensus-haproxy:
    image: haproxy:2.4
    container_name: consensus-haproxy
    volumes:
      - type: bind
        source: ./loadbalancer/consensus-haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
    ports:
      - "8080:8080"
      - "8404:8404"
    networks:
      avalanche-net:
        aliases:
          - consensus-haproxy
    restart: unless-stopped

  validator-haproxy:
    image: haproxy:2.4
    container_name: validator-haproxy
    volumes:
      - type: bind
        source: ./loadbalancer/validator-haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
    ports:
      - "8081:8081"
      - "8405:8404"
    networks:
      avalanche-net:
        aliases:
          - validator-haproxy
    restart: unless-stopped

  dag-state-haproxy:
    image: haproxy:2.4
    container_name: dag-state-haproxy
    volumes:
      - type: bind
        source: ./loadbalancer/dag-state-haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
    ports:
      - "8082:8082"
      - "8406:8404"
    networks:
      avalanche-net:
        aliases:
          - dag-state-haproxy
    restart: unless-stopped

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: avalanche-prometheus
    volumes:
      - ./monitoring/prometheus-worker.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      avalanche-net:
        aliases:
          - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: avalanche-grafana
    volumes:
      # Dashboards JSON files loaded at startup
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
      # Provisioning (preload Prometheus datasource and dashboard provider)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/worker-pools-dashboard.json
    ports:
      - "3000:3000"
    networks:
      avalanche-net:
        aliases:
          - grafana
    restart: unless-stopped

  # cAdvisor for container-level CPU/Memory metrics (Prometheus target)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    command:
      - --housekeeping_interval=10s
      - --enable_metrics=cpu,memory,network,process
    ports:
      - "8084:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      avalanche-net:
        aliases:
          - cadvisor
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: avalanche-alertmanager
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      avalanche-net:
        aliases:
          - alertmanager
    restart: unless-stopped

  # Worker Monitor for Auto-scaling
  worker-monitor:
    build:
      context: ./monitoring/worker-monitor
      dockerfile: Dockerfile
    container_name: worker-monitor
    environment:
      - REDIS_URL=redis://redis:6379
      - PROMETHEUS_URL=http://prometheus:9090
    networks:
      avalanche-net:
        aliases:
          - worker-monitor
    depends_on:
      - redis
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  avalanche-net:
    external: true
    name: avalanche-net-pool 