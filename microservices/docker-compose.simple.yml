services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    container_name: avalanche-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: avalanche-postgres
    environment:
      POSTGRES_DB: avalanche
      POSTGRES_USER: avalanche
      POSTGRES_PASSWORD: avalanche123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalanche"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Simple API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: api-gateway
    container_name: avalanche-api-gateway
    ports:
      - "9750:9750"
    environment:
      - PORT=9750
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9750/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Single consensus worker for testing
  consensus-worker:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: consensus-worker
    container_name: consensus-worker-1
    environment:
      - WORKER_ID=consensus-worker-1
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Single validator worker for testing
  validator-worker:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: validator-worker
    container_name: validator-worker-1
    environment:
      - WORKER_ID=validator-worker-1
      - REDIS_URL=redis://redis:6379
      - PORT=8081
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Single DAG/State worker for testing
  dag-state-worker:
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: dag-state-worker
    container_name: dag-state-worker-1
    environment:
      - WORKER_ID=dag-state-worker-1
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgres://avalanche:avalanche123@postgres:5432/avalanche?sslmode=disable
      - PORT=8082
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: avalanche-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-worker.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: avalanche-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  avalanche-net:
    driver: bridge 