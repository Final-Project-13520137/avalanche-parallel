services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    container_name: avalanche-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: avalanche-postgres
    environment:
      POSTGRES_DB: avalanche
      POSTGRES_USER: avalanche
      POSTGRES_PASSWORD: avalanche123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - avalanche-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalanche"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Consensus Workers
  consensus-worker-1:
    image: alpine:latest
    container_name: consensus-worker-1
    command: sh -c "echo 'Consensus Worker 1 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  consensus-worker-2:
    image: alpine:latest
    container_name: consensus-worker-2
    command: sh -c "echo 'Consensus Worker 2 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  consensus-worker-3:
    image: alpine:latest
    container_name: consensus-worker-3
    command: sh -c "echo 'Consensus Worker 3 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  # Validator Workers
  validator-worker-1:
    image: alpine:latest
    container_name: validator-worker-1
    command: sh -c "echo 'Validator Worker 1 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  validator-worker-2:
    image: alpine:latest
    container_name: validator-worker-2
    command: sh -c "echo 'Validator Worker 2 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  validator-worker-3:
    image: alpine:latest
    container_name: validator-worker-3
    command: sh -c "echo 'Validator Worker 3 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  validator-worker-4:
    image: alpine:latest
    container_name: validator-worker-4
    command: sh -c "echo 'Validator Worker 4 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  validator-worker-5:
    image: alpine:latest
    container_name: validator-worker-5
    command: sh -c "echo 'Validator Worker 5 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  # DAG State Workers
  dag-state-worker-1:
    image: alpine:latest
    container_name: dag-state-worker-1
    command: sh -c "echo 'DAG State Worker 1 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

  dag-state-worker-2:
    image: alpine:latest
    container_name: dag-state-worker-2
    command: sh -c "echo 'DAG State Worker 2 started' && sleep infinity"
    networks:
      - avalanche-net
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  avalanche-net:
    driver: bridge 