global
    maxconn 4096
    stats socket /var/run/haproxy.sock mode 600 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend consensus_frontend
    bind *:8080
    default_backend consensus_workers
    
    # Enable stats page
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

backend consensus_workers
    balance roundrobin
    option httpchk GET /health
    default-server check maxconn 250
    server-template consensus- 1-10 consensus-worker:8080 check 