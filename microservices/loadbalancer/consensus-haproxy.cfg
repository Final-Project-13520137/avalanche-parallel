global
    daemon
    maxconn 4096
    log stdout local0

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option httplog
    log global

frontend consensus_frontend
    bind *:8080
    default_backend consensus_workers

backend consensus_workers
    balance roundrobin
    option httpchk GET /health
    server consensus-worker-1 consensus-worker-1:8080 check
    server consensus-worker-2 consensus-worker-2:8080 check
    server consensus-worker-3 consensus-worker-3:8080 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE 