global
    maxconn 4096
    log stdout format raw local0 info

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend validator_frontend
    bind *:8081
    default_backend validator_workers

backend validator_workers
    balance roundrobin
    option httpchk GET /health
    server-template validator- 1-6 validator-worker:8081 check resolvers docker init-addr none