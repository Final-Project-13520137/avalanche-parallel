global
    maxconn 4096
    log stdout format raw local0 info
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other     10s
    hold refused   10s
    hold nx        10s
    hold timeout   10s
    hold valid     10s

frontend validator_frontend
    bind *:8081
    default_backend validator_workers

backend validator_workers
    balance roundrobin
    option httpchk GET /health
    server-template validator- 1-6 validator-worker:8080 check resolvers docker init-addr none

