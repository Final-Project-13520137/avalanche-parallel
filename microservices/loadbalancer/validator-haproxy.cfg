global
    daemon
    maxconn 8192
    log stdout local0

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option httplog
    log global

frontend validator_frontend
    bind *:8081
    default_backend validator_workers

backend validator_workers
    balance roundrobin
    option httpchk GET /health
    server validator-worker-1 validator-worker-1:8081 check
    server validator-worker-2 validator-worker-2:8081 check
    server validator-worker-3 validator-worker-3:8081 check
    server validator-worker-4 validator-worker-4:8081 check
    server validator-worker-5 validator-worker-5:8081 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE 