global
    maxconn 4096
    stats socket /var/run/haproxy.sock mode 600 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend validator_frontend
    bind *:8081
    default_backend validator_workers
    
    # Enable stats page
    bind *:8405
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

backend validator_workers
    balance roundrobin
    option httpchk GET /health
    default-server check maxconn 250
    server-template validator- 1-15 validator-worker:8081 check 