global
    daemon
    maxconn 4096
    log stdout local0

defaults
    mode http
    timeout connect 10000ms
    timeout client 120000ms
    timeout server 120000ms
    option httplog
    log global

frontend dag_state_frontend
    bind *:8082
    default_backend dag_state_workers

backend dag_state_workers
    balance roundrobin
    option httpchk GET /health
    server dag-state-worker-1 dag-state-worker-1:8082 check
    server dag-state-worker-2 dag-state-worker-2:8082 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE 