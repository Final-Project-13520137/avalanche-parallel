apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator-worker
  namespace: avalanche-parallel
  labels:
    app: validator-worker
    type: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: validator-worker
  template:
    metadata:
      labels:
        app: validator-worker
        type: worker
    spec:
      containers:
      - name: validator-worker
        image: localhost:5000/avalanche-validator-worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: TASK_QUEUE
          value: "validation_tasks"
        - name: RESULT_QUEUE
          value: "validation_results"
        - name: MAX_WORKERS
          value: "10"
        - name: LOG_LEVEL
          value: "info"
        - name: METRICS_ENABLED
          value: "true"
        - name: METRICS_INTERVAL
          value: "15s"
        - name: WORKER_POOL_SIZE
          value: "5"
        - name: BATCH_SIZE
          value: "100"
        - name: VALIDATION_TIMEOUT
          value: "5s"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/avalanche
          readOnly: true
        - name: logs
          mountPath: /var/log
      volumes:
      - name: config
        configMap:
          name: avalanche-config
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - validator-worker
              topologyKey: "kubernetes.io/hostname"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: validator-worker-service
  namespace: avalanche-parallel
  labels:
    app: validator-worker
spec:
  selector:
    app: validator-worker
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: validator-worker-hpa
  namespace: avalanche-parallel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: validator-worker
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15 