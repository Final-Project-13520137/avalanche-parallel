apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator-worker
  namespace: avalanche
  labels:
    app: validator-worker
    type: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: validator-worker
  template:
    metadata:
      labels:
        app: validator-worker
        type: worker
    spec:
      containers:
      - name: validator-worker
        image: avalanche-validator-worker:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: TASK_QUEUE
          value: "validation_tasks"
        - name: RESULT_QUEUE
          value: "validation_results"
        - name: MAX_WORKERS
          value: "15"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/avalanche
          readOnly: true
        - name: logs
          mountPath: /var/log
      volumes:
      - name: config
        configMap:
          name: avalanche-config
      - name: logs
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: validator-worker-service
  namespace: avalanche
  labels:
    app: validator-worker
spec:
  selector:
    app: validator-worker
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: validator-worker-hpa
  namespace: avalanche
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: validator-worker
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15 