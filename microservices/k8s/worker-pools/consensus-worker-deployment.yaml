apiVersion: apps/v1
kind: Deployment
metadata:
  name: consensus-worker-pool
  namespace: avalanche
  labels:
    app: consensus-worker
    pool: consensus
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: consensus-worker
  template:
    metadata:
      labels:
        app: consensus-worker
        pool: consensus
        component: worker
    spec:
      containers:
      - name: consensus-worker
        image: avalanche-consensus-worker:latest
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: avalanche-config
              key: REDIS_URL
        - name: TASK_QUEUE
          value: "consensus_tasks"
        - name: RESULT_QUEUE
          value: "consensus_results"
        - name: MAX_WORKERS
          value: "10"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: worker-config
          mountPath: /etc/worker
          readOnly: true
      volumes:
      - name: worker-config
        configMap:
          name: worker-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: consensus-worker-service
  namespace: avalanche
  labels:
    app: consensus-worker
spec:
  selector:
    app: consensus-worker
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consensus-worker-hpa
  namespace: avalanche
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consensus-worker-pool
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: External
    external:
      metric:
        name: redis_queue_depth
        selector:
          matchLabels:
            queue: consensus_tasks
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: avalanche
data:
  consensus.yaml: |
    worker:
      type: consensus
      max_workers: 10
      task_timeout: "60s"
      batch_size: 50
      metrics_interval: "30s"
    
    consensus:
      k: 20
      alpha: 15
      beta_virtuous: 20
      beta_rogue: 30
      max_outstanding_items: 1000
    
    queue:
      task_queue: "consensus_tasks"
      result_queue: "consensus_results"
      dead_letter_queue: "consensus_failed"
      max_retries: 3
      retry_delay: "5s"
    
    logging:
      level: info
      format: json
      file: "/var/log/consensus-worker.log"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consensus-worker-pdb
  namespace: avalanche
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: consensus-worker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: consensus-worker-monitor
  namespace: avalanche
  labels:
    app: consensus-worker
spec:
  selector:
    matchLabels:
      app: consensus-worker
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics 