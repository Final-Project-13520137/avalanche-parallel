apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: avalanche-parallel
data:
  init.sql: |
    -- Create schema for DAG state management
    CREATE SCHEMA IF NOT EXISTS dag_state;

    -- Create table for DAG vertices
    CREATE TABLE IF NOT EXISTS dag_state.dag_vertices (
        vertex_id VARCHAR(255) PRIMARY KEY,
        parent_ids JSONB DEFAULT '[]',
        children_ids JSONB DEFAULT '[]',
        depth INTEGER DEFAULT 0,
        ancestry_path JSONB DEFAULT '[]',
        confidence_score FLOAT DEFAULT 0.0,
        finalized BOOLEAN DEFAULT FALSE,
        finalized_at TIMESTAMP,
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );

    -- Create table for state updates
    CREATE TABLE IF NOT EXISTS dag_state.state_updates (
        id SERIAL PRIMARY KEY,
        vertex_id VARCHAR(255) NOT NULL,
        account_address VARCHAR(255) NOT NULL,
        state_changes JSONB NOT NULL,
        applied BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT NOW(),
        applied_at TIMESTAMP
    );

    -- Create table for snapshots
    CREATE TABLE IF NOT EXISTS dag_state.snapshots (
        id SERIAL PRIMARY KEY,
        snapshot_id VARCHAR(255) UNIQUE NOT NULL,
        vertex_id VARCHAR(255) NOT NULL,
        state_root VARCHAR(255) NOT NULL,
        account_states JSONB DEFAULT '{}',
        created_at TIMESTAMP DEFAULT NOW()
    );

    -- Create indexes for better performance
    CREATE INDEX IF NOT EXISTS idx_dag_vertices_depth ON dag_state.dag_vertices(depth);
    CREATE INDEX IF NOT EXISTS idx_dag_vertices_finalized ON dag_state.dag_vertices(finalized);
    CREATE INDEX IF NOT EXISTS idx_state_updates_vertex_id ON dag_state.state_updates(vertex_id);
    CREATE INDEX IF NOT EXISTS idx_state_updates_account ON dag_state.state_updates(account_address);
    CREATE INDEX IF NOT EXISTS idx_snapshots_vertex_id ON dag_state.snapshots(vertex_id);

    -- Grant permissions to the avalanche user
    GRANT ALL PRIVILEGES ON SCHEMA dag_state TO avalanche;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA dag_state TO avalanche;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA dag_state TO avalanche; 